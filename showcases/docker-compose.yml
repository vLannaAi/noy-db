# Local docker-compose stack for noy-db storage real-provider showcases.
#
# Brings up four services that the SMB / SSH / MySQL / NFS showcases
# (#69, #70, #71, #72) consume. Each service is independently usable;
# enable only the env vars in `showcases/.env` for the services you
# actually want to test against — closed gates keep the rest skipped.
#
# Bring up:
#   pnpm docker:up        # detached, all four services
#   pnpm docker:logs      # follow combined logs
#   pnpm docker:down      # stop + remove (volumes preserved by default)
#
# Cleanup volumes (test data + samba state):
#   docker compose -f showcases/docker-compose.yml down -v
#
# CI does NOT spin this up automatically — these are local-developer
# real-provider tests, gated behind their respective env vars.

services:
  # ─── MySQL 8 — for #69 (@noy-db/to-mysql) ─────────────────────────
  mysql:
    image: mysql:8
    container_name: noydb-showcase-mysql
    environment:
      MYSQL_ROOT_PASSWORD: noydb-showcase
      MYSQL_DATABASE: noydb_showcase
    ports:
      - '3307:3306'  # host 3307 → container 3306; avoids clash with
                     # a developer's existing local MySQL on 3306.
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-pnoydb-showcase']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    volumes:
      - mysql-data:/var/lib/mysql

  # ─── OpenSSH server — for #70 (@noy-db/to-ssh) ────────────────────
  # linuxserver's image is well-maintained, runs unprivileged, and
  # accepts `PUBLIC_KEY` env var for the test keypair we generate
  # under showcases/fixtures/ssh-test-key. SFTP is enabled by default.
  sshd:
    image: lscr.io/linuxserver/openssh-server:latest
    container_name: noydb-showcase-sshd
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: UTC
      USER_NAME: noydb
      # The test keypair lives at showcases/fixtures/ssh-test-key
      # (.pub). The .gitignore excludes the private half. Generate
      # both halves on first run:
      #   ssh-keygen -t ed25519 -N '' -f showcases/fixtures/ssh-test-key
      PUBLIC_KEY_FILE: /test-key.pub
      SUDO_ACCESS: 'false'
      PASSWORD_ACCESS: 'false'
    ports:
      - '2222:2222'
    volumes:
      - ./fixtures/ssh-test-key.pub:/test-key.pub:ro
      - sshd-data:/config

  # ─── Samba (SMB / CIFS) — for #71 (@noy-db/to-smb) ────────────────
  # Single share `noydb` exported by user `noydb` / pass `testpass`.
  # The dperson image's argv is positional: -p (port mapping); -u
  # (user); -s (share). We use `-w` for the workgroup and `-S` to
  # disable SMB1.
  samba:
    image: dperson/samba:latest
    container_name: noydb-showcase-samba
    ports:
      - '1445:445'  # host 1445 → container 445; avoids clash with
                    # macOS file sharing or Windows on 445.
    environment:
      USERID: '1000'
      GROUPID: '1000'
      TZ: UTC
    command:
      - '-S'                                  # disable SMB1
      - '-w'
      - 'WORKGROUP'
      - '-u'
      - 'noydb;testpass'
      - '-s'
      - 'noydb;/share;yes;no;no;noydb'        # name;path;browse;ro;guest;users
    volumes:
      - samba-data:/share
    # No HEALTHCHECK — Samba's smbd doesn't ship with a built-in
    # readiness probe; the helper in `_docker.ts` does a TCP-port
    # check against 1445 instead.

  # ─── NFS server — for #72 (@noy-db/to-nfs) ────────────────────────
  # The host MUST mount this export before running the showcase
  # (NFS cannot be mounted from inside a userland test process).
  # See showcases/src/76-storage-nfs.showcase.test.ts header for the
  # `mount -t nfs ...` recipe. erichough/nfs-server requires
  # privileged mode + kernel modules — that's documented as a host
  # prerequisite (Linux only; macOS users use a different export
  # path or skip this showcase).
  nfs:
    image: erichough/nfs-server:latest
    container_name: noydb-showcase-nfs
    privileged: true
    environment:
      NFS_EXPORT_0: '/exports/noydb *(rw,no_subtree_check,no_root_squash,fsid=1)'
      NFS_VERSION: '4.2'
      NFS_DISABLE_VERSION_3: '1'
    ports:
      - '2049:2049'
    volumes:
      - nfs-data:/exports/noydb

volumes:
  mysql-data:
  sshd-data:
  samba-data:
  nfs-data:
