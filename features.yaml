  - id: encryption
    name: Encryption layer
    cluster: core
    spec: SUBSYSTEMS.md#the-minimalist-core
    subsystem_doc: docs/core/02-encryption.md
    package: '@noy-db/hub'
    factory: null
    status: stable
    showcases: []
    recipes: []
    playground_pages: []
    diagrams: []
    invariants:
      - 'AES-256-GCM with fresh random 12-byte IV per encrypt operation'
      - 'PBKDF2-SHA256 with 600,000 iterations for key derivation'
      - 'AES-KW (RFC 3394) for wrapping DEKs with KEK'
      - 'KEK never persisted (in-memory only during session)'
      - 'Zero crypto dependencies — only Web Crypto API (architecture invariant: no-crypto-deps)'
      - 'Per-record CEK (opt-in `perRecordKeys: true`): a fresh AES-256-GCM content-encryption key per record, AES-KW-wrapped under the collection DEK and stored on the envelope `_cek`; body encrypts under the CEK while `_det` deterministic slots stay keyed to the collection DEK'
      - 'CEK is stable across versions: insert mints it, updates and history snapshots reuse the same CEK, so every `_history` envelope for a record carries that record `_cek` (foundation for per-record erasure #304 / record-scoped sealing #306)'
      - 'Legacy dual-read: `_cek` presence is the format discriminant, not the flag — a collection without `perRecordKeys` is byte-identical to the legacy path and a mixed vault (and recipients that never set the flag) read both kinds'
      - 'Tiers compose: elevate/demote re-wrap the same CEK from the source tier DEK to the target tier DEK (body key unchanged); bundle/extract re-key (`reKeyClosure`) re-wraps each `_cek` under the destination DEK so adopted records stay decryptable'
      - 'Tombstone tolerance: a `get()` on an envelope with no `_data`/`_cek` returns null rather than throwing TamperedError (shred tombstone creation is step 2 / #304)'
    related: [vault-and-collections, permissions]

  - id: forget-cascade
    name: GDPR crypto-shred (withForgetCascade / vault.forget)
    cluster: subsystem
    spec: docs/superpowers/specs/2026-06-08-forget-cascade-design.md
    subsystem_doc: docs/core/02-encryption.md
    package: '@noy-db/hub/forget'
    factory: withForgetCascade
    status: preview
    showcases: []
    recipes: []
    playground_pages: []
    diagrams: []
    invariants:
      - 'Per-record erasure builds on per-record CEK (#304 step 2): each declared collection is forced to `perRecordKeys: true` so a shred can erase one subject without touching the collection DEK or any other record'
      - 'Shred = TOMBSTONE, not a CEK-only delete: `vault.forget(subjectId)` rewrites the live envelope to `{_noydb,_v,_ts,_by,_iv:"",_data:""}` (drops `_iv`/`_data`/`_cek`/`_det`) AND tombstones every `_history` envelope for the record → body + all versions permanently undecryptable; version counter preserved for audit'
      - 'Encrypted portable subject index: a reserved `_subject_index` collection (own DEK) maps `sha256Hex(subjectId) → [{collection,id}]` so subject equivalence is never visible to the store; maintained on write via onAfterWrite (create/update) + an afterDelete observer (delete), rebuildable from canonical records via `vault.rebuildSubjectIndex()`'
      - 'Ledger proof without plaintext: forget appends ONE `op:"forget"` entry with empty collection/id, version 0, and `payloadHash = sha256Hex(subjectId)`; the hash-chain still `verify()`s after a shred, proving "subject existed and was erased" without retaining the subject id'
      - 'Read-path tombstone tolerance: every decrypt callsite (get, list, scan, history, CRDT reconcile/merge, findByDet, persisted-index reconcile) treats a tombstone as null/skip instead of throwing TamperedError'
      - 'Completeness gaps surfaced, never silently claimed: `forget()` reports `unmigratedRecords` (legacy body still under the collection DEK) and `blobResidueCollections` (blob attachments keyed off the separate `_blob` DEK, out of scope for record-CEK shred); idempotent (a second forget shreds nothing)'
    related: [encryption, history]

  - id: record-scoped-cek-sealing
    name: Record-scoped CEK sealing to an at-* host (vault.sealRecordToHost)
    cluster: subsystem
    spec: docs/superpowers/specs/2026-06-13-record-scoped-cek-sealing-design.md
    subsystem_doc: docs/core/02-encryption.md
    package: '@noy-db/hub'
    factory: null
    status: preview
    showcases: []
    recipes: []
    playground_pages: []
    diagrams: []
    invariants:
      - 'Binding-in-payload is the security boundary: `vault.sealRecordToHost(collection, id, hostSealer, { expiresAt })` seals a `SealedCekBinding {collection,id,cek,expiresAt}` for the host; the host re-verifies `{collection,id}` and `expiresAt` from INSIDE the sealed payload, so a tampered thin `_sealed_cek/<collection>/<id>/<pid>` delivery envelope cannot redirect a CEK to another record or extend a grant'
      - 'expiresAt is REQUIRED and authoritative: the delivery envelope carries a clear-text `expiresAt` for a fast-path reject, but `openSealedRecord()` re-checks the `expiresAt` sealed in the binding (the copy that cannot be forged) → SealedRecordExpiredError; there is NO KMS encryption context, the binding carries all authenticated context'
      - 'rotateRecordCek is the hard revocation: re-keys the live record under a fresh CEK and deletes every `_sealed_cek/<collection>/<id>/*` envelope; a host holding a PRE-rotation sealed CEK can still read PRE-rotation history versions (they keep their old `_cek`) but the POST-rotation live envelope fails the AES-GCM auth tag → TamperedError (that asymmetry IS the revocation). Both the per-record CEK cache and the decrypted-record cache are evicted synchronously so no read returns the stale old-CEK record'
      - 'Host holds no vault DEK: `openSealedRecord(sealedEnv, recordEnv, recipientSealer, expectedCollection, expectedId)` reconstructs exactly the one bound record from the sealed CEK + the encrypted body + the host unsealer alone — no collection/tier DEK, no keyring'
      - 'Host denial — A cannot decrypt B: a CEK sealed for record A presented against record B''s envelope is rejected with SealedRecordMismatchError before any decrypt; only a `perRecordKeys` record has a sealable `_cek` (legacy / non-perRecordKeys → RecordCekNotFoundError, its body stays under the never-exposed collection DEK)'
    related: [encryption, forget-cascade]

  - id: per-blob-cek
    name: Per-blob content CEK — crypto-shred of blob attachments (forget)
    cluster: subsystem
    spec: docs/superpowers/specs/2026-06-13-per-blob-cek-design.md
    subsystem_doc: docs/core/02-encryption.md
    package: '@noy-db/hub'
    factory: null
    status: stable
    showcases:
      - id: 100-with-erasable-blobs
        path: showcases/src/100-with-erasable-blobs.showcase.test.ts
    recipes: []
    playground_pages: []
    diagrams: []
    invariants:
      - 'Dedup-preserving envelope encryption: a blob on a `perRecordKeys` collection mints a per-eTag content CEK, AES-KW-wrapped under the `_blob` DEK and stored on the `BlobObject._cek`; the chunks are encrypted ONCE under that content CEK so cross-record dedup still holds (`eTag = HMAC(_blobDEK, plaintext)` is unchanged — the dedup address — and a re-uploader unwraps the same content CEK and increments refCount without re-encrypting)'
      - 'Crypto-shred at refCount 0: the BlobObject is the sole recoverable copy of the wrapped content CEK, so deleting it (when the last referencer is erased) makes the chunks permanently undecryptable even if the chunk bytes linger — a key-delete shred, not a bulk-byte delete. While refCount > 1 the content legitimately persists for its other owner (shared content is not per-subject erasable under dedup)'
      - 'Backward-compatible discriminant: `_cek` absent → legacy blob, chunks decrypt directly under the `_blob` DEK (read unchanged); off by default — non-`perRecordKeys` collections keep the byte-identical shared-`_blob`-DEK path'
    related: [encryption, forget-cascade, record-scoped-cek-sealing]

