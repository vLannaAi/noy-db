name: Release to npm

# Strict release pipeline — for @noy-db/* package publishes.
#
# (Note: @klum-db/* — the Lobby — separated out to its own repo
# vLannaAi/klum-db, which is now the sole publish source for that scope.)
#
# Triggered on GitHub Release `published`. Runs the full verification
# gate (install + build + lint + typecheck + test) on a clean checkout
# at the release tag, and only publishes if every gate passes.
#
# Publishes with `--provenance` so the npm registry attests a
# verifiable cryptographic link between the tarball and this workflow
# run (supply-chain integrity). Requires `id-token: write` permission
# on the job.
#
# ── npm dist-tag routing ─────────────────────────────────────────────
#
# The pipeline routes a publish to one of two npm dist-tags:
#
#   • `latest` — the default install (`pnpm add @noy-db/hub`). Used
#     for stable themed releases (e.g. v0.1.0-pre.5 = three-tier auth).
#   • `next`   — opt-in early-adopter channel (`pnpm add @noy-db/hub@next`).
#     Used for in-flight features the pilot consumer can pull from
#     while a stable release is still cooking.
#
# Routing rules:
#   - `release` event with `prerelease: true` (the "Set as a pre-release"
#     checkbox on the GitHub Release form) → publishes with `--tag next`.
#   - `release` event with `prerelease: false` → publishes with `--tag latest`.
#   - Manual `workflow_dispatch` → uses the `tag` input (default `latest`).
#
# Both paths preserve `--provenance` and the strict verification gate.
# The chosen tag is echoed to the workflow log + the run summary before
# any publish runs, so an unintended target shows up immediately.
#
# Setup required (one-time, in repo Settings → Secrets and variables):
#   - NPM_TOKEN (npm automation token, scope "Publish packages")
#     IMPORTANT: must have publish access to BOTH: `@noy-db/*` AND the
#     unscoped `create-noy-db` package.
#     A classic Automation token from an account that owns both works;
#     a granular token must explicitly include the @noy-db scope +
#     create-noy-db, or the missing one fails with E403.
#   - GitHub Actions must have "Read and write permissions" under
#     Settings → Actions → General → Workflow permissions
#
# Release procedure:
#   1. Bump versions in every package.json (e.g. `0.1.0-pre.6`).
#   2. Commit + push to main — PR goes through standard CI.
#   3. Tag the release commit: `git tag vX.Y.Z && git push origin vX.Y.Z`.
#   4. Create a GitHub Release against the tag.
#      - For a stable release, leave "Set as a pre-release" UNCHECKED.
#      - For an `@next` early-adopter publish, CHECK "Set as a pre-release".
#   5. This workflow fires automatically on the Release event.
#
# Manual dispatch is available for first-publish or re-publish debugging;
# it requires typing PUBLISH into the confirm field so accidental triggers
# can't publish by mistake. The `tag` input lets a maintainer override
# the dist-tag (e.g. `next`, `canary`, `rc`) without touching this file.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PUBLISH to confirm manual trigger'
        required: true
        default: ''
      tag:
        description: 'npm dist-tag (latest | next | canary | rc | beta | alpha)'
        required: false
        default: 'latest'
  push:
    branches: [main]
    paths: ['.github/workflows/release.yml']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# Was 12288: hub's dts build used to bundle each subpath entry's
# declaration graph independently (tsup's rollup-dts worker), which grew
# past 8GB across ~39 entries. #660 replaced it with a single plain
# `tsc --emitDeclarationOnly` pass (packages/hub/scripts/build.mjs), which
# peaks under 500MB — see .superpowers/sdd/m26-task-2-report.md. This cap
# is now just a generic safety margin for any job that builds/tests.
env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  # ── Gate 1: strict verification ──────────────────────────────────────
  verify:
    name: Verify (strict, node ${{ matrix.node }})
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event.inputs.confirm == 'PUBLISH' || github.event_name == 'push'
    # Full runtime matrix — the node 22 + 24 coverage that dev CI (ci.yml)
    # trades away for PR speed runs here, as a hard gate before publish.
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm turbo build

      - name: Lint
        run: pnpm turbo lint

      - name: Typecheck
        run: pnpm turbo typecheck

      # ci.yml has run this as its own job since it was written; release.yml
      # never has. A release cut by workflow_dispatch, or from a commit whose
      # CI never completed, could publish code that violates the design
      # contract — peer-deps, no-crypto-deps, hub-portable,
      # stores-ciphertext-only, strategy-opt-in, no-outbound-klum-import.
      # Cheap (<1s) and it is the guard on the trust boundary, so the publish
      # path should not be the one place it is absent.
      - name: Architecture contract
        run: node scripts/check-architecture.mjs

      # HARD GATE: unlike dev CI, a failing test here BLOCKS the publish
      # (this is the last line of defence before npm), on both node 22 + 24.
      # Two-phase schedule matches dev CI (#564) — kept in lockstep per cbf07ea4.
      - name: Test (hub)
        run: pnpm turbo test --filter=@noy-db/hub
      - name: Test (satellites)
        run: pnpm turbo test --filter='!@noy-db/hub' --concurrency=4

      - name: Verify package.json versions match release tag
        if: github.event_name == 'release'
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          HUB_VERSION=$(node -p "require('./packages/hub/package.json').version")
          if [ "$HUB_VERSION" != "$VERSION" ]; then
            echo "❌ @noy-db/hub version ($HUB_VERSION) does not match release tag ($VERSION)"
            exit 1
          fi
          echo "✅ @noy-db/hub@$HUB_VERSION matches release tag v$VERSION"

      # The dist-tag is routed entirely by the "Set as a pre-release" checkbox on
      # the Release form, so a forgotten tick publishes a pre-release to @latest.
      # That is not self-healing: it takes a manual `npm dist-tag` repair across
      # every package in the scope. @klum-db/lobby@latest is rotten in exactly
      # this way (stuck at 0.2.0-pre.26, peers demanding hub ^0.2.0-pre.24, so an
      # untagged install cannot co-install with the current family). Refuse the
      # mismatch rather than rely on the checkbox. Ported from noy-db-ui#22.
      #
      # Only this direction is blocked: a STABLE version published to @next is
      # harmless and recoverable, so it stays allowed.
      - name: Refuse a semver pre-release routed to @latest
        if: github.event_name == 'release'
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          if [ "${{ github.event.release.prerelease }}" != "true" ] && [ "${VERSION#*-}" != "$VERSION" ]; then
            echo "::error::$VERSION is a semver pre-release, but this Release is not marked as a pre-release."
            echo "::error::Publishing would route it to @latest and corrupt the tag for every @noy-db/* package."
            echo "::error::Tick 'Set as a pre-release' on the Release and re-run."
            exit 1
          fi
          echo "✅ routing check passed (version=$VERSION, prerelease=${{ github.event.release.prerelease }})"

  # ── Gate 1b: cross-OS interop (advisory) ─────────────────────────────
  # WinZip-AES-256 interop across ubuntu/macOS/windows (7z/unar/choco).
  # Moved here from dev CI: it's the slowest leg, so it runs only at
  # release time. Advisory (continue-on-error) — it does NOT gate publish
  # (never been first-green); it surfaces cross-tool regressions to the
  # maintainer at release without blocking. Flip to a hard gate once green.
  interop:
    name: Interop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'release' || github.event.inputs.confirm == 'PUBLISH'
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Enable corepack (pnpm)
        run: corepack enable
      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Install 7-Zip (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y p7zip-full
      - name: Install 7-Zip + unar (macOS)
        if: runner.os == 'macOS'
        run: brew install sevenzip unar
      - name: Install 7-Zip (Windows)
        if: runner.os == 'Windows'
        run: choco install 7zip -y
      - name: Run interop tests
        working-directory: packages/as-zip
        run: pnpm vitest run __tests__/interop.test.ts --reporter=verbose

  # ── Gate 2: publish with provenance ──────────────────────────────────
  #
  # Explicit event guard: publish only runs on:
  #   - a `release` event (someone created a GitHub Release), or
  #   - a `workflow_dispatch` with `confirm: PUBLISH` typed in.
  #
  # The `verify` job above also runs on `push` to main when this file
  # changes (so workflow edits get tested), but the publish step
  # MUST NOT run on that path — otherwise pushing a workflow edit
  # could auto-publish a brand-new package to npm without explicit
  # confirmation. The pnpm publish skip-already-published heuristic
  # protects existing packages but new ones at fresh versions would
  # land on npm unintentionally.
  publish:
    name: Publish to npm
    needs: verify
    if: |
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'PUBLISH')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for npm --provenance
    outputs:
      # Consumed by the docs-bridge job so the payload records the channel
      # this publish actually routed to, rather than recomputing the rule.
      dist_tag: ${{ steps.dist_tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm turbo build

      # Resolve the npm dist-tag for this run. Computed once + echoed
      # to the run summary so an unintended target shows up before any
      # publish runs. Allowlist guards against typos in workflow_dispatch
      # input — the publish step refuses to run with an unknown tag.
      - name: Resolve npm dist-tag
        id: dist_tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            if [ "${{ github.event.release.prerelease }}" = "true" ]; then
              TAG="next"
              REASON="release event, prerelease=true"
            else
              TAG="latest"
              REASON="release event, prerelease=false"
            fi
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
            REASON="workflow_dispatch tag input"
          else
            TAG="latest"
            REASON="default"
          fi

          case "$TAG" in
            latest|next|canary|rc|beta|alpha) ;;
            *)
              echo "❌ Refusing to publish: tag '$TAG' is not in the allowlist (latest|next|canary|rc|beta|alpha)."
              exit 1
              ;;
          esac

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "### npm dist-tag" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tag:** \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Reason:** $REASON" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$TAG" = "latest" ]; then
            echo "Consumers run \`pnpm add @noy-db/hub\` (default install)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Consumers run \`pnpm add @noy-db/hub@$TAG\` (opt-in channel)." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Check which npm account the token belongs to. If this step fails,
      # the token is invalid; if it shows the wrong user, the user's account
      # doesn't own create-noy-db.
      - name: Check npm auth (whoami)
        run: |
          WHOAMI=$(npm whoami 2>&1) && echo "npm user: $WHOAMI" || echo "npm whoami failed: $WHOAMI"
          echo "npm user: ${WHOAMI:-failed}" >> "$GITHUB_STEP_SUMMARY"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        continue-on-error: true

      # Publish the scoped @noy-db/* packages first. pnpm's recursive publish
      # resolves workspace:* peer-deps to real versions at publish time, walks
      # the dependency graph in topological order (hub first, dependents next),
      # and skips any version already on the registry — so re-runs are safe.
      #
      # `--no-git-checks` because the publish job checks out a tag, not a
      # branch — pnpm's default branch-clean check would fail otherwise.
      # `--provenance` mirrors what the create-noy-db step does (id-token
      # write permission is already granted on the job above).
      - name: Publish @noy-db/* scoped packages
        run: |
          set -o pipefail
          echo "Publishing @noy-db/* with --tag ${{ steps.dist_tag.outputs.tag }}"
          pnpm publish -r --filter '@noy-db/*' \
            --access public \
            --tag '${{ steps.dist_tag.outputs.tag }}' \
            --no-git-checks \
            --provenance 2>&1 | tee /tmp/scoped-publish.log
          EXIT=${PIPESTATUS[0]}
          if [ "$EXIT" -ne 0 ]; then
            echo "### Scoped publish failed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/scoped-publish.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$EXIT"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Re-point `latest` for packages with no stable release. The rationale,
      # the safety guard, and the list live in the script — one definition,
      # shared with the manual `dist-tags.yml` repair path.
      - name: Re-point latest for pre-only packages
        if: steps.dist_tag.outputs.tag != 'latest'
        run: node scripts/repoint-pre-only-latest.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Align `next` onto the stable. A stable cut breaks the "@next runs ahead
      # of @latest" invariant MECHANICALLY, with nobody making a mistake:
      # 0.6.0 > 0.6.0-pre.24, because a prerelease sorts below its own release.
      # So the moment `latest` moves, `next` is behind it for ~52 packages at
      # once. Pointing both at the stable is self-correcting — the next
      # prerelease publish restores the invariant on its own.
      #
      # NOT continue-on-error, and NOT the never-fail-the-caller posture of the
      # step above. That one is right there: a stale `latest` on a pre-only
      # package is cosmetic, and reddening a release over it trains people to
      # stop reading the log. This runs while DELIVERING A STABLE across
      # packages that ship together, where a half-applied state is worse than a
      # loud failure — it is exactly the state a human then repairs by hand
      # with an OTP. The script prints those recovery commands on failure.
      #
      # The version is pushed IN rather than read from CI context, so the logic
      # is runnable from a terminal: this trigger cannot fire until a real
      # stable cut, so anything reading `github.*` internally would be testable
      # only by cutting one.
      - name: Align next onto the stable
        if: steps.dist_tag.outputs.tag == 'latest'
        run: |
          # Same source the publish used, and the same one the tag-vs-version
          # gate above already checked against the Release tag.
          VERSION="$(node -p "require('./packages/hub/package.json').version")"
          node scripts/align-next-to-stable.mjs --version="$VERSION"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # pnpm pack resolves workspace:* to real versions; npm publish sends
      # the resulting tarball directly — bypassing pnpm's own publish path.
      - name: Pack create-noy-db tarball
        id: pack
        working-directory: packages/create-noy-db
        run: |
          pnpm pack --pack-destination /tmp/
          echo "tarball=$(ls /tmp/create-noy-db-*.tgz | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Publish create-noy-db
        run: |
          set -o pipefail
          echo "Publishing create-noy-db with --tag ${{ steps.dist_tag.outputs.tag }}"
          npm publish "${{ steps.pack.outputs.tarball }}" \
            --access public \
            --tag '${{ steps.dist_tag.outputs.tag }}' 2>&1 | tee /tmp/npm-publish.log
          EXIT=${PIPESTATUS[0]}
          if [ "$EXIT" -ne 0 ]; then
            echo "### Publish failed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/npm-publish.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$EXIT"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summarise
        run: |
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release: \`${{ github.event.release.tag_name || github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- npm dist-tag: \`${{ steps.dist_tag.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Provenance: enabled (look for the ✓ on https://www.npmjs.com/package/@noy-db/hub)" >> "$GITHUB_STEP_SUMMARY"

  # ── Docs bridge (#913) ────────────────────────────────────────────────
  #
  # Emits the machine-readable release payload (docs-bridge.json) for the
  # essential to-* stores and attaches it to the GitHub release, giving
  # noy-db-docs the same structured input noy-db-to already provides
  # (producer spec: noy-db-to/docs/superpowers/specs/2026-07-30-docs-bridge-design.md).
  # Same `bridge: 1` schema, so noy-db-docs/scripts/sync/bridge.mjs parses
  # either repo's payload unchanged.
  #
  # This is now the ONLY doc-sync notification path. `publish` used to carry
  # a separate `Notify noy-db-docs of a new publish` step (`gh issue create`,
  # gated `latest`-only, unconditional on delta) — removed. Two paths meant
  # two independent gating decisions: `publish`'s step had no payload to
  # check gate (b) against (the payload is built here), so it always opened
  # an issue on every stable release regardless of delta, defeating gate (a)
  # for exactly the case ("stable while `latest` is parked") it exists to
  # suppress. Consolidating onto this job's find-or-create means the one
  # place that HAS the payload is the one place that decides whether an
  # issue opens.
  #
  # Job-level continue-on-error: a docs-side outage or an unprovisioned
  # secret must never mark a successful publish as failed.
  #
  # The payload is built, validated, and attached to the release on EVERY
  # publish, both channels, no exceptions — the asset is the permanent
  # record (design: noy-db-docs/docs/superpowers/specs/
  # 2026-08-05-family-channel-policy-design.md §3, superseding the
  # `dist_tag == 'latest'` job gate this job used to carry).
  #
  # Only the doc-sync issue step below is gated, on two independent
  # conditions:
  #   (a) Active rail — DOC_SYNC_CHANNELS lists which npm dist-tag channels
  #       are currently synced to docs. Pre-1.0 that's `next` only; `latest`
  #       is parked (still gets its payload asset, opens/comments on no
  #       issue) until the rail table flips at 1.0.
  #   (b) Real delta — some package in the payload is `added`/`updated`, or
  #       carries a non-empty changelog. An all-`version-only` payload opens
  #       nothing even on an active rail.
  #
  # Both gates log their reason clearly to the workflow output so a green
  # run with no issue is legible, not silent.
  docs-bridge:
    name: Docs bridge payload
    needs: publish
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      # Space-separated list of npm dist-tag channels currently synced to
      # docs. Pre-1.0: `next` only. At 1.0 this becomes `next latest`.
      DOC_SYNC_CHANNELS: next
    permissions:
      contents: write   # gh release upload
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Hub's dist IS required, despite the dump running under vitest. vitest
      # resolves the stores' own `.js → .ts` source imports, but the stores
      # import the workspace hub through its exports map
      # (`@noy-db/hub/to` → `packages/hub/dist/to/index.js`), so a fresh runner
      # with only `pnpm install` fails with ERR_MODULE_NOT_FOUND. This is the
      # fresh-runner gotcha noy-db-to's spec warns about — it does not apply
      # there, because those stores bind the PUBLISHED hub. Hub alone is
      # enough; the four stores need nothing else built.
      - name: Build hub (the stores import its subpaths)
        run: pnpm turbo build --filter @noy-db/hub

      - name: Build payload
        run: |
          set -euo pipefail
          DOCS_BRIDGE_CAPS_OUT=/tmp/caps.json pnpm vitest run --project scripts \
            __tests__/docs-bridge-capabilities.test.ts
          node scripts/docs-bridge/build-payload.mjs \
            --caps /tmp/caps.json \
            --tag '${{ github.event.release.tag_name }}' \
            --channel '${{ needs.publish.outputs.dist_tag }}' \
            --run-url '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}' \
            > /tmp/docs-bridge.json
          node -e "const p=require('/tmp/docs-bridge.json'); if (p.bridge!==1||!p.packages.length) process.exit(1); console.log('payload ok:', p.packages.length, 'packages')"

      - name: Attach payload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" /tmp/docs-bridge.json --clobber

      # Open the doc-sync issue in noy-db-docs (or comment on a matching one
      # left over from a re-run of this job) — the single notification path,
      # gated on active-rail + real-delta first (see job header). Body
      # carries what the old `publish`-job step carried (published package
      # list, run link) plus the payload asset link and per-store
      # classification that step never had.
      - name: Open or update the doc-sync issue
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.DOCS_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name }}"
          CHANNEL="${{ needs.publish.outputs.dist_tag }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ASSET_URL="${{ github.server_url }}/${{ github.repository }}/releases/download/$TAG/docs-bridge.json"

          # Gate (a): active rail. DOC_SYNC_CHANNELS is a space-separated list.
          if ! echo " $DOC_SYNC_CHANNELS " | grep -q " $CHANNEL "; then
            echo "No doc-sync issue opened/commented: channel '$CHANNEL' is parked (DOC_SYNC_CHANNELS=\"$DOC_SYNC_CHANNELS\"). Payload asset is still attached to the release." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Gate (b): real delta. An all-version-only payload with no
          # changelog text anywhere is not worth an issue.
          if ! node --input-type=module -e "
            import { hasRealDelta } from './scripts/docs-bridge/build-payload.mjs'
            import { readFileSync } from 'node:fs'
            const p = JSON.parse(readFileSync('/tmp/docs-bridge.json', 'utf8'))
            process.exit(hasRealDelta(p) ? 0 : 1)
          "; then
            echo "No doc-sync issue opened/commented: payload has no delta (every package is version-only with no changelog) on channel '$CHANNEL'. Payload asset is still attached to the release." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          PACKAGES=$(pnpm ls -r --filter '@noy-db/*' --depth -1 --json | jq -r '.[] | select(.private != true) | .name' | sort)

          {
            echo "Release \`$TAG\` was just published to npm dist-tag \`$CHANNEL\`."
            echo ""
            echo "- Channel: \`$CHANNEL\`"
            echo "- Run: $RUN_URL"
            echo "- Machine-readable payload (schema \`bridge: 1\`): $ASSET_URL"
            echo ""
            echo "Published packages:"
            echo "$PACKAGES" | sed 's/^/- /'
            echo "- create-noy-db"
            echo ""
            echo "Per-store classification (essential to-* stores, from the payload):"
            node -e "
              const p = require('/tmp/docs-bridge.json');
              for (const x of p.packages) {
                const verb = { added: 'ADD', updated: 'UPDATE', 'version-only': 'VERSION-ONLY' }[x.changeType];
                console.log(\`- **\${verb}** \\\`\${x.name}@\${x.version}\\\` (\${x.shape})\`);
              }
            "
            echo ""
            echo "Please run the doc-sync (registry/llms.txt + llms-full.txt regeneration) for this release — see \`docs.manifest.json\` for the last-synced version per channel. Run it against the payload with \`--bridge-repo vLannaAi/noy-db --bridge-tag $TAG\`, or pass the downloaded asset directly with \`--bridge <file>\` (noy-db-docs#191 added the repo flag; the payload self-identifies, so a mismatched repo now fails loudly instead of silently ingesting the other producer's data)."
          } > /tmp/bridge-comment.md

          cat /tmp/bridge-comment.md >> "$GITHUB_STEP_SUMMARY"

          # Family convention: `doc-sync needed: <repo> vX.Y.Z @channel`. The repo
          # name is NOT decoration — noy-db and noy-db-ui both filed unprefixed
          # titles, and were distinguishable only because their version lines
          # happen to differ (0.6.x vs 0.3.x). That is a coincidence of numbering,
          # not a property of the title. The same discipline already exists one
          # layer down: `bridge.mjs`'s `parseBridge` takes `expectedRepo` and
          # throws on mismatch, added because a same-named tag CAN exist in two
          # producers. The payload was guarded; the title was not.
          #
          # TITLE is built ONCE and reused by all three sites below — the search,
          # the exact-match filter, and the create. They must never drift: an
          # idempotency search that does not match what `create` writes files a
          # duplicate on every re-run, silently.
          TITLE="doc-sync needed: noy-db $TAG @$CHANNEL"

          NUM=$(gh issue list -R vLannaAi/noy-db-docs --state open --limit 20 \
            --search "$TITLE in:title" \
            --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)

          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" -R vLannaAi/noy-db-docs --body-file /tmp/bridge-comment.md
          else
            gh issue create -R vLannaAi/noy-db-docs \
              --title "$TITLE" \
              --body-file /tmp/bridge-comment.md
          fi

      # The job is `continue-on-error: true` so a docs-side outage can never
      # fail a publish that already succeeded — deliberate, and correct.
      #
      # The side effect is that "non-fatal" and "invisible" became the same
      # setting: the run reports success while this job is red, with nothing in
      # the summary to say so. noy-db-to lost two releases to exactly that
      # (a store missing from the payload wiring threw here, twice, both runs
      # green — noy-db-to#93).
      #
      # This step runs only on failure and writes a loud line to the run
      # summary. It cannot affect the publish: `continue-on-error` already
      # swallowed the failure at job level.
      - name: Surface a bridge failure in the run summary
        if: failure()
        run: |
          {
            echo "## ⚠️ Docs bridge FAILED — the publish succeeded, this did not"
            echo ""
            echo "\`docs-bridge.json\` was **not** attached to \`${{ github.event.release.tag_name }}\`,"
            echo "and no doc-sync issue was filed in noy-db-docs."
            echo ""
            echo "The publish itself is unaffected and needs no action."
            echo ""
            echo "Most likely cause: a published \`packages/to-*\` store missing from the payload"
            echo "wiring — \`build-payload.mjs\` throws on the first unregistered store."
            echo "\`scripts/__tests__/docs-bridge-capabilities.test.ts\` derives the expected set"
            echo "from the filesystem and should have caught that in the PR; if it did not, the"
            echo "derivation and the payload script have drifted apart."
            echo ""
            echo "Re-run this job after fixing, or run the doc-sync manually."
          } >> "$GITHUB_STEP_SUMMARY"
