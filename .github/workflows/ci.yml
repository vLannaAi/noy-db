name: CI

# Dev CI — fast feedback on every PR and push to main.
# Jobs: architecture → lint/typecheck → build → test (node 24).
# Single flake-free runtime for speed; the full node 22+24 test matrix and
# the cross-OS interop run pre-publish as a hard gate in release.yml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Was 12288: hub's dts build used to bundle each subpath entry's
# declaration graph independently (tsup's rollup-dts worker), which grew
# past 8GB across ~39 entries. #660 replaced it with a single plain
# `tsc --emitDeclarationOnly` pass (packages/hub/scripts/build.mjs), which
# peaks under 500MB — see .superpowers/sdd/m26-task-2-report.md. This cap
# is now just a generic safety margin for any job that builds/tests.
env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  # ── Architecture invariants ──────────────────────────────────────────
  # Enforces the design contract: peer-dep convention, zero crypto deps,
  # hub stays portable (no Node-only imports), and stores never see
  # plaintext. Cheap (~40ms) — runs on every PR before the heavier jobs.
  architecture:
    name: Architecture invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check
        run: node scripts/check-architecture.mjs
      # A package that selects a test ENVIRONMENT must declare what provides it.
      # Declaring is not self-enforcing: pnpm's virtual store still satisfies an
      # undeclared package from a sibling that declares it, so a deleted
      # declaration leaves every suite green. Only a static check catches it —
      # and it runs HERE, with the other no-install checks, because it reads
      # manifests against usage and never resolves anything.
      - name: Test-environment dependencies declared
        run: node scripts/check-test-env-deps.mjs

  # ── Lint + typecheck ─────────────────────────────────────────────────
  quality:
    name: Lint + typecheck
    needs: [architecture]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Enable corepack (pnpm)
        run: corepack enable
      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Turbo cache
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-
      - name: Lint
        run: pnpm turbo lint
      - name: Typecheck
        run: pnpm turbo typecheck

  # ── Build (once — caches for test matrix) ────────────────────────────
  build:
    name: Build
    needs: [architecture]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Enable corepack (pnpm)
        run: corepack enable
      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Turbo cache
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-
      - name: Build
        run: pnpm turbo build
      # The bundle-size + cross-leak gate (packages/hub/scripts/check-bundle.mjs)
      # resolves `@noy-db/hub` through the built dist, so it belongs here
      # rather than on the build-free architecture job — this was never
      # CI-wired before (turbo's bundle-check task exists but nothing
      # invoked it).
      - name: Bundle check (hub)
        run: pnpm --filter @noy-db/hub bundle-check
      # Runs HERE and not in the architecture job, which has no install and no
      # build: this reads the published .d.ts surface, so `dist/` must exist.
      # #1072 checks fenced imports; this checks the methods our prose attributes
      # to db/vault/collection, which is the half those three phantom services
      # lived in.
      - name: Prose names real methods
        run: pnpm check:prose-api
      # Codemod-map coverage (#1154). Lives here rather than on the build-free
      # `architecture` job for the same reason as the bundle check: it reads the
      # BUILT surface, because what a consumer can import is a fact about dist,
      # not about src.
      - name: Codemod coverage
        run: pnpm check:codemods

      # #837 — every subpath must export the types its own signatures name.
      # Runs here because the check reads the BUILT .d.ts surface (what a
      # consumer actually resolves), not the source.
      - name: Type reachability (hub subpaths)
        run: pnpm --filter @noy-db/hub check:types

      # #913 — release tooling (scripts/) is not a package, so turbo never
      # reaches it. Without this step the docs-bridge tests are dead code.
      - name: Release tooling tests (scripts/)
        run: pnpm test:scripts

  # ── Test (dev CI) ────────────────────────────────────────────────────
  # Single flake-free runtime (node 24) for fast PR feedback. The full
  # node 22 + 24 matrix AND the cross-OS interop run pre-publish in
  # release.yml — the hard gate before anything reaches npm.
  # Depends on build only: lint/typecheck gates the PR in parallel;
  # serializing test behind it added ~2 min of dead critical-path time.
  test:
    name: Test (node 24)
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Enable corepack (pnpm)
        run: corepack enable
      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node24-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-node24-pnpm-
      - name: Install
        run: pnpm install --frozen-lockfile
      # Restores the build job's .turbo cache (same commit sha) so this
      # step is a cache hit instead of a full cold rebuild per matrix leg.
      - name: Turbo cache
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-
      - name: Build
        run: pnpm turbo build
      # Two-phase test schedule (#564). The historical --concurrency=1
      # guarded against cross-package collisions, but an empirical sweep
      # found none: suites already use fs.mkdtemp-style unique dirs and no
      # fixed ports. What DOES exist is CPU contention — hub (~400 test
      # files, the box's dominant consumer) starving wall-clock-sensitive
      # tests in whatever runs beside it. So: hub runs ALONE with the full
      # runner (its vitest workers parallelize internally), then the
      # satellites run at --concurrency=4 (matched to the 4-vCPU runner).
      # The recurring in-pinia TamperedError flake was a real hub race
      # (concurrent openVault() building two key-divergent Vaults) — fixed
      # at the root by the single-flight memo in kernel/noydb.ts.
      - name: Test (hub)
        run: pnpm turbo test --filter=@noy-db/hub
      - name: Test (satellites)
        run: pnpm turbo test --filter='!@noy-db/hub' --concurrency=4

  # ── Interop moved to the pre-publish gate ────────────────────────────
  # The cross-OS WinZip-AES-256 interop matrix (ubuntu/macOS/windows +
  # 7z/unar/choco installs) is the slowest, advisory leg, so it no longer
  # runs on PRs or main. It now runs in release.yml as part of the full
  # pre-publish gate, alongside the node 22 + 24 test matrix.
