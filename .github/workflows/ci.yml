name: CI

# Standard CI — runs on every PR and push to main.
# Jobs: architecture → spec-coverage → lint/typecheck → build → test (matrix).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Architecture invariants ──────────────────────────────────────────
  # Enforces the design contract: peer-dep convention, zero crypto deps,
  # hub stays portable (no Node-only imports), and stores never see
  # plaintext. Cheap (~40ms) — runs on every PR before the heavier jobs.
  architecture:
    name: Architecture invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check
        run: node scripts/check-architecture.mjs

  # ── Spec coverage ────────────────────────────────────────────────────
  # Validates features.yaml — the spec ↔ artefact registry. Every entry's
  # paths must resolve, every showcase id must match its filename, every
  # cross-reference must hit a registered id, every spec anchor must
  # exist in the target markdown. The diagram render-drift check piggy-
  # backs once Phase 2/3 introduces the first .mmd sources.
  spec-coverage:
    name: Spec coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Enable corepack (pnpm)
        run: corepack enable
      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Render diagrams (noop until Phase 2/3)
        run: pnpm render:diagrams
      - name: Validate features registry
        run: pnpm validate:features
      - name: Check storage-capability matrix is in sync
        run: pnpm render:storage-matrix -- --check

  # ── Lint + typecheck ─────────────────────────────────────────────────
  quality:
    name: Lint + typecheck
    needs: [architecture, spec-coverage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Enable corepack (pnpm)
        run: corepack enable
      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm turbo lint
      - name: Typecheck
        run: pnpm turbo typecheck

  # ── Build (once — caches for test matrix) ────────────────────────────
  build:
    name: Build
    needs: [architecture, spec-coverage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Enable corepack (pnpm)
        run: corepack enable
      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm turbo build

  # ── Test matrix (runtime-supported Node versions) ────────────────────
  test:
    name: Test (node ${{ matrix.node }})
    needs: [quality, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Enable corepack (pnpm)
        run: corepack enable
      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node${{ matrix.node }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-node${{ matrix.node }}-pnpm-
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm turbo build
      # Concurrency=1 avoids cross-package temp-dir / port collisions
      # that surfaced with the default parallel runner. Each package's
      # test suite is fast on its own; serializing them adds < 1 minute
      # to the matrix wall time.
      # @noy-db/showcases is a private demo workspace whose topology tests
      # require real-cloud credentials (Cloudflare R2, Supabase, WebDAV).
      # Excluded from CI; runnable locally with .env populated.
      - name: Test
        run: pnpm turbo test --concurrency=1 --filter '!@noy-db/showcases'

  # ── WinZip-AES-256 cross-tool interop ────────────────────────────────
  # Shells out to 7z and unar on 3 OS runners to validate that our
  # WinZip-AES-256 writer/reader is compatible with real archive tools.
  # continue-on-error: true until the matrix is green for the first time.
  interop:
    name: Interop (${{ matrix.os }})
    needs: [quality, build]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Enable corepack (pnpm)
        run: corepack enable
      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Ubuntu's apt `unar` package is too old to read modern WinZip-AES-256;
      # skip unar on Linux. Tests auto-skip via hasTool('unar') check.
      - name: Install 7-Zip (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y p7zip-full

      - name: Install 7-Zip + unar (macOS)
        if: runner.os == 'macOS'
        run: brew install sevenzip unar

      - name: Install 7-Zip (Windows)
        if: runner.os == 'Windows'
        run: choco install 7zip -y

      - name: Run interop tests
        working-directory: packages/as-zip
        run: pnpm vitest run __tests__/interop.test.ts --reporter=verbose
