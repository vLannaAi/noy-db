name: CI

# Dev CI — fast feedback on every PR and push to main.
# Jobs: architecture → spec-coverage → lint/typecheck → build → test (node 24).
# Single flake-free runtime for speed; the full node 22+24 test matrix and
# the cross-OS interop run pre-publish as a hard gate in release.yml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Hub ships dts for 28 subpath entries off a very large type surface
# (field-metadata epic); tsup's rollup-dts worker needs more than the
# default heap or it dies with ERR_WORKER_OUT_OF_MEMORY. Applies to every
# job that builds (build, lint+typecheck, test, interop).
env:
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  # ── Architecture invariants ──────────────────────────────────────────
  # Enforces the design contract: peer-dep convention, zero crypto deps,
  # hub stays portable (no Node-only imports), and stores never see
  # plaintext. Cheap (~40ms) — runs on every PR before the heavier jobs.
  architecture:
    name: Architecture invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check
        run: node scripts/check-architecture.mjs

  # ── Spec coverage ────────────────────────────────────────────────────
  # Validates features.yaml — the spec ↔ artefact registry. Every entry's
  # paths must resolve, every showcase id must match its filename, every
  # cross-reference must hit a registered id, every spec anchor must
  # exist in the target markdown. The diagram render-drift check piggy-
  # backs once Phase 2/3 introduces the first .mmd sources.
  spec-coverage:
    name: Spec coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Enable corepack (pnpm)
        run: corepack enable
      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Render diagrams (noop until Phase 2/3)
        run: pnpm render:diagrams
      - name: Validate features registry
        run: pnpm validate:features
      - name: Check storage-capability matrix is in sync
        run: pnpm render:storage-matrix -- --check

  # ── Lint + typecheck ─────────────────────────────────────────────────
  quality:
    name: Lint + typecheck
    needs: [architecture, spec-coverage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Enable corepack (pnpm)
        run: corepack enable
      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Turbo cache
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-
      - name: Lint
        run: pnpm turbo lint
      - name: Typecheck
        run: pnpm turbo typecheck

  # ── Build (once — caches for test matrix) ────────────────────────────
  build:
    name: Build
    needs: [architecture, spec-coverage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Enable corepack (pnpm)
        run: corepack enable
      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Turbo cache
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-
      - name: Build
        run: pnpm turbo build

  # ── Test (dev CI) ────────────────────────────────────────────────────
  # Single flake-free runtime (node 24) for fast PR feedback. The full
  # node 22 + 24 matrix AND the cross-OS interop run pre-publish in
  # release.yml — the hard gate before anything reaches npm.
  # Depends on build only: lint/typecheck gates the PR in parallel;
  # serializing test behind it added ~2 min of dead critical-path time.
  test:
    name: Test (node 24)
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Enable corepack (pnpm)
        run: corepack enable
      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node24-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-node24-pnpm-
      - name: Install
        run: pnpm install --frozen-lockfile
      # Restores the build job's .turbo cache (same commit sha) so this
      # step is a cache hit instead of a full cold rebuild per matrix leg.
      - name: Turbo cache
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-
      - name: Build
        run: pnpm turbo build
      # Concurrency=1 avoids cross-package temp-dir / port collisions
      # that surfaced with the default parallel runner. Each package's
      # test suite is fast on its own; serializing them adds < 1 minute
      # to the matrix wall time.
      # @noy-db/showcases is a private demo workspace whose topology tests
      # require real-cloud credentials (Cloudflare R2, Supabase, WebDAV).
      # Excluded from CI; runnable locally with .env populated.
      - name: Test
        run: pnpm turbo test --concurrency=1 --filter '!@noy-db/showcases'

  # ── Interop moved to the pre-publish gate ────────────────────────────
  # The cross-OS WinZip-AES-256 interop matrix (ubuntu/macOS/windows +
  # 7z/unar/choco installs) is the slowest, advisory leg, so it no longer
  # runs on PRs or main. It now runs in release.yml as part of the full
  # pre-publish gate, alongside the node 22 + 24 test matrix.
